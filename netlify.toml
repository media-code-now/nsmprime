[build]
  command = "npm run blog:deploy"
  publish = "out"
  
[build.environment]
  NODE_VERSION = "20"

# Blog redirects - redirect old HTML pages to new Next.js routes
[[redirects]]
  from = "/blog.html"
  to = "/blog-hub.html"
  status = 301
  force = true

# Catch any blog-related queries
[[redirects]]
  from = "/blog.html/*"
  to = "/blog-hub.html"
  status = 301

# Topic category redirects
[[redirects]]
  from = "/topics/seo/"
  to = "/seo-hub.html"
